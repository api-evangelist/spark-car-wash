aid: spark-car-wash
name: Spark Car Wash
description: >-
  Spark Car Wash is an express-tunnel car wash operator running a network of
  high-throughput drive-thru locations across New Jersey, Pennsylvania and New
  York. The company pairs a conveyorized tunnel — neoglide washers, custom
  non-acidic cleaning formulas, high-intensity dryers, and a closed-loop water
  reclamation and filtration system — with self-service "Spark Park" terminals
  offering multi-nozzle vacuums, anti-scratch towels and automated mat cleaners.
  Revenue is driven by unlimited-wash memberships sold in Standard, Select and
  Signature tiers, with additional-vehicle discounts, alongside single-wash
  purchases. Membership signup and account management run on a third-party
  hosted portal rather than a Spark-operated application. Spark Car Wash is a
  physical services operator: it publishes no developer program, no public API,
  no SDKs and no machine-readable contract of any kind.
